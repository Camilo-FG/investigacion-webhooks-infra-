services:
  service-a:
    image: camilitofge/webhooks-servicio-a:latest
    build: ./servicio-a
    container_name: service-a
    ports:
      - "${PORT_A:-3000}:3000"
    environment:
      PORT: 3000
      HMAC_SECRET: ${HMAC_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      SERVICE_B_URL: http://service-b:3001
      ONVO_SECRET_KEY: ${ONVO_SECRET_KEY}
      ONVO_PUBLISHABLE_KEY: ${ONVO_PUBLISHABLE_KEY}
      ONVO_WEBHOOK_SECRET: ${ONVO_WEBHOOK_SECRET}
      ONVO_VERIFY_EVENTS: ${ONVO_VERIFY_EVENTS:-true}
    restart: unless-stopped

  service-b:
    image: camilitofge/webhooks-servicio-b:latest
    build: ./servicio-b
    container_name: service-b
    ports:
      - "${PORT_B:-3001}:3001"
    environment:
      PORT: 3001
      HMAC_SECRET: ${HMAC_SECRET}
      DEFAULT_WEBHOOK_URL: http://service-a:3000/webhooks/payments
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-3000}
      DEFERRED_THRESHOLD: ${DEFERRED_THRESHOLD:-50000}
    restart: unless-stopped

  frontend:
    image: camilitofge/webhooks-frontend:latest
    build: ./investigacionwebhooksfrontend
    container_name: frontend
    ports:
      - "${PORT_FRONTEND:-8080}:80"
    depends_on:
      - service-a
      - service-b
    restart: unless-stopped
